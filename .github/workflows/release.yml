name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Build release ZIP
        run: git archive --format=zip --output="Form-filling-tool-${GITHUB_REF_NAME}.zip" "${GITHUB_REF_NAME}"

      - name: Attest release ZIP
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: Form-filling-tool-${{ github.ref_name }}.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Form-filling-tool-${{ github.ref_name }}.zip
          generate_release_notes: true
          overwrite_files: true
